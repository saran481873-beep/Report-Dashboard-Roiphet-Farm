<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roiphet Farm — Executive Dashboard 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
:root{
  --green:#16a34a; --green-bg:#dcfce7; --green-line:#86efac;
  --yellow:#d97706; --yellow-bg:#fef3c7; --yellow-line:#fcd34d;
  --red:#dc2626; --red-bg:#fee2e2; --red-line:#fca5a5;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --card:#ffffff;
  --bg:#f1f5f9; --head1:#0f766e; --head2:#134e4a; --accent:#0d9488;
  --radius:14px; --gap:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;zoom:1.15}
@media (max-width:900px){ body{zoom:1} }
.wrap{max-width:1360px;margin:0 auto;padding:20px}
a{color:inherit;text-decoration:none}
/* Header */
.head{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;border-radius:var(--radius);padding:20px 26px;margin-bottom:var(--gap);box-shadow:0 6px 20px rgba(15,118,110,.25)}
.head-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.head .sub{font-size:13px;opacity:.85;margin-top:3px}
.head .asof{font-size:12px;opacity:.85;text-align:right}
.head .asof b{font-size:14px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:6px;justify-content:flex-end}
.live-dot{width:9px;height:9px;border-radius:50%;background:#f87171}
.live-dot.on{background:#4ade80;animation:lp 2s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.refresh-btn{cursor:pointer;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:4px 9px;font-size:13px;margin-left:8px}
.refresh-btn:hover{background:rgba(255,255,255,.22)}
/* Nav */
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.nav a{font-size:13px;font-weight:700;padding:8px 15px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.2)}
.nav a.on{background:#fff;color:var(--head2);border-color:#fff}
.backlink{display:inline-block;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--accent);cursor:pointer}
/* Filters */
.filters{margin-top:16px;display:flex;flex-wrap:wrap;gap:18px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup .flabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.8;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;user-select:none;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;transition:.15s}
.chip:hover{background:rgba(255,255,255,.2)}
.chip.on{background:#fff;color:var(--head2);border-color:#fff}
/* Home cards */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--gap)}
.mcard{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;transition:.18s;border-top:5px solid var(--accent);display:flex;flex-direction:column;gap:8px;min-height:170px}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(15,118,110,.16)}
.mcard .ic{font-size:34px}
.mcard h3{font-size:18px;font-weight:800}
.mcard p{font-size:13px;color:var(--muted);flex:1}
.mcard .go{font-size:12px;font-weight:700;color:var(--accent)}
.mcard.ext{border-top-color:#6366f1}
.mcard.c-sit{border-top-color:#16a34a}.mcard.c-perf{border-top-color:#0d9488}.mcard.c-week{border-top-color:#d97706}
.mcard.c-fin{border-top-color:#7c3aed}.mcard.c-order{border-top-color:#dc2626}
.mcard.c-stock{border-top-color:#2563eb}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:5px solid var(--accent)}
.kpi.g{border-left-color:var(--green)} .kpi.y{border-left-color:var(--yellow)} .kpi.r{border-left-color:var(--red)} .kpi.b{border-left-color:#2563eb} .kpi.v{border-left-color:#7c3aed} .kpi.dim{border-left-color:#94a3b8}
.kpi .klabel{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .kval{font-size:30px;font-weight:800;margin-top:6px;line-height:1}
.kpi .ksub{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
/* Cards / layout */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.grid2.wide{grid-template-columns:1.2fr .8fr}
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:var(--gap)}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
canvas{max-height:300px}
/* Tables */
.tablecard{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:var(--gap);overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.dtable th{position:sticky;top:0;background:#f8fafc;text-align:center;font-size:11px;letter-spacing:.3px;color:var(--muted);padding:9px 8px;border-bottom:2px solid var(--line)}
.dtable td{padding:7px 9px;border-bottom:1px solid #f1f5f9;text-align:center}
.dtable td.l{text-align:left}
.dtable tr:hover td{background:#f8fafc}
.dtable tfoot td{font-weight:800;background:#f0fdfa;border-top:2px solid var(--accent)}
.pondtag{font-weight:700;font-family:ui-monospace,monospace}
.pondtag.bad{color:var(--red)}
.mod-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e0f2fe;color:#0369a1}
.colfilter select{width:100%;font-size:11px;padding:2px 4px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#334155}
.stat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.stat-a{background:#dcfce7;color:#15803d}
.stat-p{background:#f1f5f9;color:#64748b}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.g{background:var(--green-bg);color:var(--green)} .pill.r{background:var(--red-bg);color:var(--red)} .pill.b{background:#e0e7ff;color:#4338ca} .pill.dim{background:#e2e8f0;color:#475569}
/* Situation map */
.mapcard{overflow-x:auto}
.sitmap{border-collapse:collapse;margin:0 auto;font-family:ui-monospace,monospace}
.sitmap td{border:1px solid #e5e7eb;text-align:center;font-size:10.5px;font-weight:700;padding:4px 5px;min-width:34px;height:26px;color:#0f172a;white-space:nowrap}
.sitmap td.pond{border:1px solid rgba(0,0,0,.18)}
.sitmap td.pond.dim{opacity:.18}
.sitmap td.lbl{font-family:'Noto Sans Thai';font-weight:800;color:#334155}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);display:inline-block}
/* Cost segments */
.costgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.costbox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s}
.costbox:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(13,148,136,.12)}
.costbox .cl{font-size:12px;color:var(--muted);font-weight:700}
.costbox .cv{font-size:22px;font-weight:800;margin-top:4px}
.costbox .cd{font-size:11px;color:var(--accent);font-weight:700;margin-top:4px}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal-h h4{font-size:16px;font-weight:700}
.modal-h .x{cursor:pointer;font-size:22px;color:var(--muted);border:none;background:none}
.modal-b{padding:16px 22px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:7px;border:1px solid var(--line)}
.mrow .mp{font-weight:700}
.mrow .mv{font-weight:800}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:6px 4px 10px}
.footnote{font-size:12px;color:var(--muted);text-align:center;padding:16px}
.loading{text-align:center;padding:50px;color:var(--muted);font-weight:600}
.hidden{display:none!important}
@media(max-width:920px){.grid2,.grid2.wide{grid-template-columns:1fr}}
/* ---- Situation modern polish ---- */
.kpi{position:relative;transition:.18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.09)}
.kpi .ksic{position:absolute;top:14px;right:16px;font-size:20px;opacity:.55}
.mapcard{background:linear-gradient(180deg,#ffffff,#f8fafb)}
.maptbl-wrap{overflow-x:auto;padding:4px 2px 8px;border-radius:12px}
.sitgrid{display:grid;grid-auto-rows:30px;gap:3px;width:max-content;margin:6px auto;padding-right:36px;--pw:38px}
.modcell{justify-content:flex-start}
.modcell.right span{margin-left:-2px}
.sitgrid .gpond{border-radius:10px;font:700 10px/1 ui-monospace,monospace;display:flex;align-items:center;justify-content:center;text-align:center;color:#0f172a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.1);transition:.12s;overflow:hidden}
.sitgrid .gpond:hover{transform:scale(1.14);z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.sitgrid .gpond.dim{opacity:.15}
.sitgrid .gpond.rw{font-size:8px;box-shadow:inset 0 0 0 2px #0f766e,0 1px 3px rgba(0,0,0,.18)}
.sitgrid .statcell,.sitgrid .modcell{overflow:visible;white-space:nowrap;z-index:3}
.sitgrid .statcell{display:flex;align-items:center}
.sitgrid .modcell{display:flex;align-items:center}
.statpill{display:inline-block;width:96px;flex-shrink:0;padding:9px 0;text-align:center;border-radius:999px;font-size:14px;font-weight:800;color:#0f172a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.16);white-space:nowrap}
.modcell span{font-size:15.5px;font-weight:800;color:#0f766e;letter-spacing:.3px;padding:7px 16px;border-radius:10px;background:#ecfdf5;box-shadow:inset 0 0 0 1.5px #99f6e4;white-space:nowrap}
.rwswatch{width:14px;height:14px;border-radius:4px;background:#ccffff;box-shadow:inset 0 0 0 2px #0f766e;display:inline-block}
.sit-blocklabel{font-size:13px;font-weight:800;color:#134e4a;margin:20px 0 10px;padding-left:10px;border-left:4px solid #0d9488}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;max-width:660px}
.rpond{font-family:ui-monospace,monospace;font-weight:700;font-size:11.5px;text-align:center;padding:12px 6px;border-radius:10px;color:#0f172a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.08);transition:.12s}
.rpond:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.18)}
.rpond.dim{opacity:.16}
.legend{padding-top:16px;margin-top:16px;border-top:1px dashed var(--line)}
.dtable.stripe tbody tr:nth-child(even) td{background:#fafcfc}
.dtable.stripe tbody tr:hover td{background:#eefaf7}
.dtable .grp{background:#ecfdf5;color:#0f766e;border-bottom:2px solid #a7f3d0}
.dtable tr.totrow td{font-weight:800;background:#f0fdfa;border-top:2px solid var(--accent)}
.dtable tr.hlrow td{background:#fffbeb}
.dtable tr.hlrow .mod-badge{background:#fde68a;color:#92400e}
/* ---- global modern polish (Performance/Weekly/Financial/Order Harvest) ---- */
.card,.tablecard{background:linear-gradient(180deg,#ffffff,#fbfdfd);border:1px solid #eef2f4}
.kpi{background:linear-gradient(180deg,#ffffff,#fbfdfd)}
.kpi .ksic{position:absolute;top:14px;right:16px;font-size:20px;opacity:.5}
.dtable th{background:#f0fdfa;color:#0f766e;border-bottom:2px solid #99f6e4;font-weight:700}
.dtable tbody tr:nth-child(even) td{background:#fafcfc}
.dtable tbody tr:hover td{background:#eefaf7}
.dtable tfoot td{background:#f0fdfa;border-top:2px solid var(--accent);font-weight:800}
.costbox{background:linear-gradient(180deg,#f8fafc,#eef6f5);transition:.16s}
.costbox:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 16px rgba(13,148,136,.14)}
.mcard{background:linear-gradient(180deg,#ffffff,#fafdfd)}
.costbox .cd{color:#0d9488}
.pill.b{background:#e0f2fe;color:#0369a1}
/* ---- larger, clearer typography ---- */
body{font-size:15px}
.head h1{font-size:24px}
.head .sub{font-size:14.5px}
.nav a{font-size:14px}
.chip{font-size:14px}
.fgroup .flabel{font-size:12px}
.kpi .klabel{font-size:13px}
.kpi .kval{font-size:35px}
.kpi .ksub{font-size:13.5px}
.card h3,.tablecard h3{font-size:17px}
.card .hint,.hint{font-size:13.5px}
.dtable{font-size:14px}
.dtable th{font-size:12.5px}
.dtable td{padding:10px 11px}
.tablecard .hint{font-size:13.5px}
.costbox .cl{font-size:13.5px}
.costbox .cv{font-size:27px}
.costbox .cd{font-size:12.5px}
.pill{font-size:12.5px}
.mod-badge{font-size:12.5px}
.pondtag{font-size:14px}
.mcard h3{font-size:20px}
.mcard p{font-size:14.5px}
.mcard .go{font-size:13.5px}
.section-title{font-size:14px}
.mrow .mp{font-size:14.5px}
.mrow .mv{font-size:16px}
.footnote{font-size:13.5px}
.legend{font-size:14px}
.sitgrid .gpond{font-size:12px}
.sitgrid .gpond.rw{font-size:10px}
.statpill{font-size:14.5px}
.modcell span{font-size:16px}
.modal-h h4{font-size:18px}
/* IN Stock hover tooltip */
.ohtip{position:fixed;z-index:100;display:none;background:#0f172a;color:#fff;border-radius:10px;padding:10px 13px;box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:12.5px;max-width:280px;max-height:340px;overflow:auto;pointer-events:none}
.ohtip-h{font-weight:800;margin-bottom:6px;color:#5eead4;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:5px}
.ohtip-r{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
.ohtip-r span{font-family:ui-monospace,monospace}
.ohtip-r b{color:#fde68a}
.dtable tr.stkrow:hover td{background:#eefaf7}
/* Spotlight search */
.spot-btn{cursor:pointer;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;margin-left:8px;display:inline-flex;align-items:center;gap:6px}
.spot-btn:hover{background:rgba(255,255,255,.22)}
.spot-btn kbd{font-size:10px;font-weight:700;opacity:.75;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:1px 4px}
.spot-box{background:#fff;border-radius:16px;max-width:580px;width:100%;max-height:72vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.spot-inputwrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.spot-ic{font-size:17px}
.spot-input{flex:1;border:none;outline:none;font-size:16px;font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:transparent}
.spot-esc{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}
.spot-results{overflow-y:auto;padding:8px;max-height:56vh}
.spot-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.spot-item:hover,.spot-item.sel{background:#f0fdfa}
.spot-item .si-l{display:flex;align-items:center;gap:10px;overflow:hidden}
.spot-item .si-ic{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.spot-item .si-t{font-weight:700;font-size:13.5px;font-family:ui-monospace,monospace}
.spot-item .si-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.spot-item .spot-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;flex-shrink:0}
.spot-empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
@keyframes spotflash{0%{background:#fef08a}70%{background:#fef9c3}100%{background:transparent}}
tr.spot-hl td{animation:spotflash 2.3s ease-out}
/* Widget hide/show + local spotlight */
.card h3,.tablecard h3{display:flex;align-items:center;gap:8px}
.hide-btn{margin-left:auto;cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;line-height:1;padding:4px 7px;border-radius:6px;opacity:.5;transition:.15s;flex-shrink:0}
.hide-btn:hover{opacity:1;background:#fee2e2;color:#dc2626}
#hiddenBar{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;background:#fffbeb;border:1px dashed #fbbf24}
#hiddenBar .hb-lbl{font-size:12.5px;font-weight:700;color:#92400e;flex-shrink:0}
#hiddenBar .chip{background:#fff;border-color:#fde68a;color:#92400e;font-size:12px}
#hiddenBar .chip.all{margin-left:auto;background:#92400e;color:#fff;border-color:#92400e}
@keyframes spotflash2{0%{box-shadow:0 0 0 4px #fde68a,0 1px 3px rgba(0,0,0,.07)}100%{box-shadow:0 1px 3px rgba(0,0,0,.07)}}
.spot-hl2{animation:spotflash2 2.3s ease-out}
.aichat{display:flex;flex-direction:column;height:520px}
.aichat-log{flex:1;overflow-y:auto;padding:4px 4px 8px;display:flex;flex-direction:column;gap:10px}
.aimsg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.6}
.aimsg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
.aimsg.user{align-self:flex-end;background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;border-bottom-right-radius:4px}
.aimsg table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.aimsg table th,.aimsg table td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}
.aimsg table th.l,.aimsg table td.l{text-align:left}
.aimsg table th{color:var(--muted);font-weight:600}
.aichips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.aichip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background .15s}
.aichip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.aiinput-row{display:flex;gap:10px;margin-top:12px}
.aiinput{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-family:'Noto Sans Thai',sans-serif;outline:none}

.pnl-sechead .badge{font-size:10px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pnl-card-body{padding:14px 16px}
.pnl-kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.pnl-kv:last-child{border-bottom:none}
.pnl-kv .k{color:var(--muted)}
.pnl-kv .v{font-weight:700;color:var(--ink)}
.pnl-banner{border-radius:14px;padding:18px;text-align:center}
.pnl-banner.pos{background:var(--green-bg);border:1px solid var(--green-line)}

.pnl-banner .plabel{font-size:12px;font-weight:700;color:var(--muted)}
.pnl-banner .amt{font-size:26px;font-weight:800;margin-top:4px}
.pnl-sechead.emerald{background:linear-gradient(90deg,var(--head2),var(--accent))}
.pfield-box{background:#fff;border:1px solid var(--yellow-line);border-radius:10px;padding:10px 12px;margin-bottom:8px}

.biomass-form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}

.bsubmit:hover{opacity:.92}
.bsubmit:disabled{opacity:.6;cursor:default}
.bres{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}

.bitem b{font-size:17px;color:var(--ink)}

<body>
<div class="wrap">
  <div class="head">
    <div class="head-top">
      <div>
        <h1>🦐 Roiphet Farm — Executive Dashboard 2026</h1>
        <div class="sub" id="subtitle">ศูนย์รวมข้อมูลผู้บริหาร · Module A · B · C · D</div>
      </div>
      <div class="asof">ข้อมูล ณ<br><b id="asof">กำลังโหลด…</b>
        <div class="live-badge"><span class="live-dot" id="livedot"></span><span id="livetext">กำลังเชื่อมต่อ…</span><button class="refresh-btn" id="refresh" title="รีเฟรช">↻</button><button class="spot-btn" id="spotBtn" title="ค้นหาบ่อ/พื้นที่/หน้า">ค้นหา <kbd>Ctrl K</kbd></button></div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div id="filterbar"></div>
  </div>
  <div id="app"><div class="loading">กำลังโหลด…</div></div>
  <div class="footnote">อัปเดตอัตโนมัติทุกวัน · ดึงข้อมูลสดจาก 2026 Daily Report · Roiphet Farm</div>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <div class="modal-h"><h4 id="mTitle"></h4><button class="x" onclick="closeModal()">×</button></div>
  <div class="modal-b" id="mBody"></div>
</div></div>

<div class="overlay" id="spotOverlay"><div class="spot-box">
  <div class="spot-inputwrap"><input type="text" id="spotInput" class="spot-input" placeholder="ค้นหาบ่อ, พื้นที่, ตาราง/กราฟในหน้านี้, หรือหน้า Dashboard… เช่น A5I09, Module B, Scorecard" autocomplete="off"><span class="spot-esc">ESC ปิด</span></div>
  <div class="spot-results" id="spotResults"></div>
</div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbyNznon22ahA9zsdkxSM4D8CthhsrC2yMlWITm_1lP65ay8qKKGZ-9Ar58RtF2GeeEN/exec';
const DAILY_URL='https://saran481873-beep.github.io/Report-Dashboard-Roiphet-Farm/daily-report.html';
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const PAGES=[
  {id:'home',label:'หน้าหลัก'},
  {id:'situation',label:'1 · Situation'},
  {id:'performance',label:'2 · Performance'},
  {id:'weekly',label:'3 · Weekly'},
  {id:'daily',label:'4 · Daily ↗',ext:DAILY_URL},
  {id:'financial',label:'5 · Financial'},
  {id:'orderharvest',label:'6 · Order Harvest'},
  {id:'stocking',label:'7 · Stocking'}
  ,{id:'ai',label:'8 · AI Assistant'}
  ,{id:'biomass',label:'9 · Estimate Biomass'}
  ,{id:'prepare',label:'10 · Prepare pond'}
  ,{id:'pnl',label:'11 · Profit & Loss Forecast'}
];
const cache={};
let charts=[];
if(window.Chart&&window.ChartDataLabels){ Chart.register(window.ChartDataLabels); Chart.defaults.plugins.datalabels={display:false}; Chart.defaults.font.family="'Noto Sans Thai',sans-serif"; }
function destroyCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];}
async function getTab(tab){
  if(cache[tab])return cache[tab];
  let lastErr;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const r=await fetch(API+'?tab='+encodeURIComponent(tab),{cache:'no-store'});
      const txt=await r.text();
      const j=JSON.parse(txt);
      cache[tab]=j;
      return j;
    }catch(e){
      lastErr=e;
      if(attempt<2) await new Promise(res=>setTimeout(res,600*(attempt+1)));
    }
  }
  throw lastErr;
}
function num(x){ if(x==null)return NaN; const s=String(x).replace(/[, %]/g,'').replace(/[^\d.\-]/g,''); const n=parseFloat(s); return isNaN(n)?NaN:n; }
function fmt(n,d){ if(n==null||isNaN(n))return '–'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function el(t){return document.getElementById(t);}

/* ---------- ROUTER ---------- */
function route(){ let h=(location.hash||'#home').slice(1); const p=PAGES.find(x=>x.id===h); if(!p){h='home';} renderNav(h); renderPage(h); }
function renderNav(active){
  el('nav').innerHTML=PAGES.map(p=>p.ext?`<a href="${p.ext}" target="_blank">${p.label}</a>`:`<a href="#${p.id}" class="${p.id===active?'on':''}">${p.label}</a>`).join('');
}
window.addEventListener('hashchange',route);

/* ---------- MODAL ---------- */
function openModal(title,html){el('mTitle').innerHTML=title;el('mBody').innerHTML=html;el('overlay').classList.add('show');}
function closeModal(){el('overlay').classList.remove('show');}
el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeModal();});

/* ---------- SPOTLIGHT SEARCH ---------- */
let spotIndex=null, spotItems=[], spotSel=0, spotlightTarget=null;
async function buildSpotIndex(){
  if(spotIndex)return spotIndex;
  const idx=PAGES.filter(p=>p.id!=='home').map(p=>({type:'page',id:p.id,title:p.label,ext:p.ext}));
  ['A','B','C','D','R'].forEach(m=>idx.push({type:'module',mod:m}));
  try{
    const wk=await getTab('weekly'); const W=wk.values; const H=W[0];
    const gi=(name)=>H.findIndex(h=>(h||'').trim().toLowerCase()===name.toLowerCase());
    const iPond=gi('Pond'),iMod=gi('Module'),iType=gi('Type'),iStat=gi('Status'),iDOC=gi('DOC');
    for(let i=1;i<W.length;i++){ const pond=(W[i][iPond]||'').trim(); if(!pond)continue;
      idx.push({type:'pond',pond,mod:(W[i][iMod]||'').trim(),ptype:(W[i][iType]||'').trim(),status:(W[i][iStat]||'').trim(),doc:(W[i][iDOC]||'').trim()});
    }
  }catch(e){}
  spotIndex=idx; return idx;
}
function spotScore(q,item){
  const hay=(item.type==='page'?item.title:item.type==='module'?('module '+item.mod):item.type==='widget'?item.title:(item.pond+' '+item.mod)).toLowerCase();
  const i=hay.indexOf(q); return i<0?-1:(hay.startsWith(q)?1000-i:500-i);
}
function currentPageWidgets(){
  const page=(location.hash||'#home').slice(1);
  if(page==='home'||page==='daily')return [];
  return Array.from(document.querySelectorAll('#app [data-widget-page="'+page+'"]')).map(n=>({type:'widget',page,id:n.dataset.widgetId,title:n.dataset.widgetTitle,hidden:n.style.display==='none'}));
}
async function spotSearch(q){
  const idx=await buildSpotIndex();
  const widgets=currentPageWidgets();
  if(!q)return widgets.length? widgets.concat(idx.filter(x=>x.type==='page').slice(0,4)) : idx.filter(x=>x.type==='page').slice(0,6);
  const ql=q.toLowerCase();
  return widgets.concat(idx).map(x=>({x,s:spotScore(ql,x)})).filter(r=>r.s>=0).sort((a,b)=>b.s-a.s).slice(0,30).map(r=>r.x);
}
function spotItemHtml(item,i){
  const sel=i===spotSel?' sel':'';
  if(item.type==='page')return `<div class="spot-item${sel}" onmouseenter="spotSel=${i};refreshSpotSel()" onclick="spotOpen(${i})"><div class="si-l"><div><div class="si-t" style="font-family:inherit">${item.title}</div><div class="si-s">ไปที่หน้า Dashboard</div></div></div><span class="spot-tag">หน้า</span></div>`;
  if(item.type==='module')return `<div class="spot-item${sel}" onmouseenter="spotSel=${i};refreshSpotSel()" onclick="spotOpen(${i})"><div class="si-l"><div><div class="si-t" style="font-family:inherit">Module ${item.mod}</div><div class="si-s">ดูภาพรวมพื้นที่ที่หน้า Situation</div></div></div><span class="spot-tag">พื้นที่</span></div>`;
  if(item.type==='widget')return `<div class="spot-item${sel}" onmouseenter="spotSel=${i};refreshSpotSel()" onclick="spotOpen(${i})"><div class="si-l"><div><div class="si-t" style="font-family:inherit">${item.title}</div><div class="si-s">${item.hidden?'ซ่อนอยู่ · คลิกเพื่อแสดงและเลื่อนไปดู':'ตาราง/กราฟในหน้านี้ · คลิกเพื่อเลื่อนไปดู'}</div></div></div><span class="spot-tag" style="${item.hidden?'background:#fef3c7;color:#92400e':''}">${item.hidden?'ซ่อนอยู่':'ในหน้านี้'}</span></div>`;
  return `<div class="spot-item${sel}" onmouseenter="spotSel=${i};refreshSpotSel()" onclick="spotOpen(${i})"><div class="si-l"><div><div class="si-t">${item.pond}</div><div class="si-s">Module ${item.mod||'-'} · ${item.ptype||'-'} · ${item.status||'-'}${item.doc?' · DOC '+item.doc+' วัน':''}</div></div></div><span class="spot-tag">บ่อ</span></div>`;
}
async function spotRender(q){
  spotItems=await spotSearch(q); spotSel=0;
  const box=el('spotResults');
  if(!box)return;
  if(!spotItems.length){ box.innerHTML=`<div class="spot-empty">ไม่พบผลลัพธ์สำหรับ "${q}"</div>`; return; }
  box.innerHTML=spotItems.map((it,i)=>spotItemHtml(it,i)).join('');
}
function refreshSpotSel(){ const nodes=el('spotResults').querySelectorAll('.spot-item'); nodes.forEach((n,i)=>n.classList.toggle('sel',i===spotSel)); const s=nodes[spotSel]; if(s)s.scrollIntoView({block:'nearest'}); }
window.spotOpen=function(i){
  const item=spotItems[i]; if(!item)return;
  if(item.type==='page'){ closeSpotlight(); if(item.ext){window.open(item.ext,'_blank');} else if(location.hash==='#'+item.id){renderPage(item.id);} else {location.hash='#'+item.id;} return; }
  if(item.type==='module'){ F.situation.area=[item.mod]; closeSpotlight(); if(location.hash==='#situation'){renderPage('situation');} else {location.hash='#situation';} return; }
  if(item.type==='widget'){
    closeSpotlight();
    if(item.hidden){ showWidget(item.page,item.id); }
    else{ const node=document.querySelector('[data-widget-id="'+item.id+'"][data-widget-page="'+item.page+'"]'); if(node){ const y=node.getBoundingClientRect().top+window.scrollY-90; window.scrollTo(0,y); node.classList.add('spot-hl2'); setTimeout(()=>node.classList.remove('spot-hl2'),2300); } }
    return;
  }
  spotlightTarget=item.pond; F.weekly.area=['all']; F.weekly.type='all'; F.weekly.status='all';
  closeSpotlight();
  if(location.hash==='#weekly'){renderPage('weekly');} else {location.hash='#weekly';}
};
function openSpotlight(){ el('spotOverlay').classList.add('show'); const inp=el('spotInput'); inp.value=''; spotRender(''); setTimeout(()=>inp.focus(),30); }
function closeSpotlight(){ el('spotOverlay').classList.remove('show'); }
el('spotOverlay').addEventListener('click',e=>{ if(e.target===el('spotOverlay'))closeSpotlight(); });
el('spotBtn').onclick=openSpotlight;
el('spotInput').addEventListener('input',e=>spotRender(e.target.value.trim()));
el('spotInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); spotSel=Math.min(spotSel+1,spotItems.length-1); refreshSpotSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); spotSel=Math.max(spotSel-1,0); refreshSpotSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(spotItems.length)spotOpen(spotSel); }
  else if(e.key==='Escape'){ closeSpotlight(); }
});
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSpotlight(); return; }
  if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'){ e.preventDefault(); openSpotlight(); }
  else if(e.key==='Escape'){ closeSpotlight(); }
});

/* ---------- LIVE STATUS ---------- */
function setLive(ok,txt){el('livedot').classList.toggle('on',ok);el('livetext').textContent=txt;}
el('refresh').onclick=()=>{for(const k in cache)delete cache[k];route();};

/* ---------- WIDGET HIDE/SHOW (per-page, persisted) ---------- */
function getHidden(page){ try{ return JSON.parse(localStorage.getItem('hiddenWidgets_'+page)||'[]'); }catch(e){ return []; } }
function setHidden(page,arr){ try{ localStorage.setItem('hiddenWidgets_'+page,JSON.stringify(arr)); }catch(e){} }
function decorateWidgets(page){
  const app=el('app'); if(!app)return;
  const nodes=app.querySelectorAll('.card, .tablecard');
  const hidden=getHidden(page);
  nodes.forEach((node,i)=>{
    const h3=node.querySelector('h3'); if(!h3)return;
    const id='w'+i;
    const title=(h3.textContent||'').trim();
    node.dataset.widgetId=id; node.dataset.widgetTitle=title; node.dataset.widgetPage=page;
    if(!h3.querySelector('.hide-btn')){
      const btn=document.createElement('button');
      btn.type='button'; btn.className='hide-btn'; btn.title='ซ่อนการ์ดนี้ (หาเจอได้อีกครั้งผ่านช่องค้นหา)';
      btn.textContent='×';
      btn.addEventListener('click',(e)=>{ e.stopPropagation(); hideWidget(page,id); });
      h3.appendChild(btn);
    }
    if(hidden.includes(id))node.style.display='none';
  });
  renderHiddenBar(page);
}
function renderHiddenBar(page){
  const hidden=getHidden(page);
  const app=el('app');
  let bar=document.getElementById('hiddenBar');
  if(!hidden.length){ if(bar)bar.remove(); return; }
  const items=hidden.map(id=>{
    const node=document.querySelector('[data-widget-id="'+id+'"][data-widget-page="'+page+'"]');
    const title=node?node.dataset.widgetTitle:id;
    return `<span class="chip" onclick="showWidget('${page}','${id}')">${title}</span>`;
  }).join('');
  const html=`<div id="hiddenBar"><span class="hb-lbl">ซ่อนอยู่ ${hidden.length} รายการ:</span>${items}<span class="chip all" onclick="showAllWidgets('${page}')">แสดงทั้งหมด</span></div>`;
  if(bar){ bar.outerHTML=html; } else if(app){ app.insertAdjacentHTML('afterbegin',html); }
}
window.hideWidget=function(page,id){
  const arr=getHidden(page); if(!arr.includes(id))arr.push(id); setHidden(page,arr);
  const node=document.querySelector('[data-widget-id="'+id+'"][data-widget-page="'+page+'"]'); if(node)node.style.display='none';
  renderHiddenBar(page);
};
window.showWidget=function(page,id){
  const arr=getHidden(page).filter(x=>x!==id); setHidden(page,arr);
  const node=document.querySelector('[data-widget-id="'+id+'"][data-widget-page="'+page+'"]');
  if(node){ node.style.display=''; const y=node.getBoundingClientRect().top+window.scrollY-90; window.scrollTo(0,y); node.classList.add('spot-hl2'); setTimeout(()=>node.classList.remove('spot-hl2'),2300); }
  renderHiddenBar(page);
};
window.showAllWidgets=function(page){
  setHidden(page,[]);
  document.querySelectorAll('#app [data-widget-page="'+page+'"]').forEach(n=>{ n.style.display=''; });
  renderHiddenBar(page);
};

/* filter state per page */
const F={situation:{type:'all',area:['all']},performance:{month:['all'],area:['all']},weekly:{type:'all',status:'all',area:['all'],sortKey:null,sortDir:1},financial:{month:['all'],area:['all']},orderharvest:{size:'all',area:['all']},stocking:{area:['all'],month:['all'],type:['all'],week:['all'],year:['all']},prepare:{area:['all'],type:['all'],unit:['all']}};

/* ---------- PAGE DISPATCH ---------- */
async function renderPage(id){
  destroyCharts(); el('filterbar').innerHTML='';
  if(id==='home'){el('subtitle').textContent='ศูนย์รวมข้อมูลผู้บริหาร · Module A · B · C · D';renderHome();return;}
  el('app').innerHTML='<div class="loading">กำลังโหลดข้อมูลสด…</div>';
  try{
    if(id==='situation')await pageSituation();
    else if(id==='performance')await pagePerformance();
    else if(id==='weekly')await pageWeekly();
    else if(id==='financial')await pageFinancial();
    else if(id==='orderharvest')await pageOrder();
    else if(id==='stocking')await pageStocking();
  else if(id==='ai')await pageAI();
  else if(id==='biomass')await pageBiomass();

function mkColFilterRow(tableId,cols){
  var data=(window.__tblData||{})[tableId]||[];

    var opts=vals.map(function(v){return `<option value="${v.split('"').join('&quot;')}">${v}</option>`;}).join('');

window.tblFilterApply=function(tableId){
  var table=document.getElementById(tableId);
  if(!table) return;
  var selects=table.querySelectorAll('.colfilter select');
  var filters={};
  selects.forEach(function(s){ if(s.value) filters[s.dataset.fcol]=s.value; });
  var data=(window.__tblData||{})[tableId]||[];
  var rows=table.querySelectorAll('tbody tr');
  rows.forEach(function(tr,i){
    var r=data[i];
    if(!r){ tr.style.display=''; return; }

function perfBlocks(V){ const b=[]; for(let i=0;i<V.length;i++){ if((V[i][0]||'').trim()==='By Closed Date'){ let label=''; if(V[i-1])for(let c=0;c<V[i-1].length;c++){if((V[i-1][c]||'').trim()){label=V[i-1][c].trim();break;}} b.push({row:i,label}); } } return b; }
function perfMetricMap(V,blockRow){ const m={}; for(let k=1;k<=28;k++){ const lab=(V[blockRow+k]?(V[blockRow+k][0]||'').trim():''); if(lab)m[lab]=blockRow+k; } return m; }
function perfVal(V,mrow,col){ return num(V[mrow]?V[mrow][col]:NaN); }

async function pagePerformance(){
  el('subtitle').textContent='บทวิเคราะห์ประสิทธิภาพการเลี้ยง · จำแนกตามพื้นที่';

  const blocks=perfBlocks(V);

  filterBar('performance',[
    {label:'เดือน',key:'month',multi:true,hint:'เลือกได้หลายเดือน',opts:[{v:'all',t:'ทั้งปี'}].concat(MONTHS.map((m,i)=>({v:String(i),t:MONTH_TH[i]})))},
    {label:'พื้นที่ (Module)',key:'area',multi:true,opts:[{v:'all',t:'รวมทั้งฟาร์ม'},{v:'A',t:'A'},{v:'B',t:'B'},{v:'C',t:'C'},{v:'D',t:'D'},{v:'R',t:'R'}]}
  ]);
  const monthSel = Array.isArray(st.month)?st.month:[st.month]; const isAllMonth = monthSel.includes('all'); const cols = isAllMonth?[13]:monthSel.map(m=>1+parseInt(m)); // total col=13
  const RATE_METRICS=new Set(['Yield (kg/rai)','%SR','FCR','AVG Size','DOC','Production Cost (B/kg)','ADG']);
  function combineColsOnly(mm2,name,cols){
    const r=mm2[name]; if(r==null)return NaN;
    const pr=mm2['Production(ton)'];
    let sum=0,wsum=0,wtot=0,any=false;
    cols.forEach(c=>{
      const v=perfVal(V,r,c); if(isNaN(v))return; any=true; sum+=v;
      const w=pr!=null?perfVal(V,pr,c):NaN;
      if(!isNaN(w)){ wsum+=v*w; wtot+=w; }
    });
    if(!any)return NaN;
    return RATE_METRICS.has(name) ? (wtot?wsum/wtot:sum/cols.length) : sum;
  }
  function combineMetric(mods,name,cols){
    let sum=0,wsum=0,wtot=0,any=false;
    mods.forEach(mc=>{
      const b=blocks.find(bb=>bb.label.toUpperCase().indexOf('MODULE '+mc)>=0); if(!b)return;
      const m2=perfMetricMap(V,b.row); const r=m2[name]; if(r==null)return;
      const pr=m2['Production(ton)'];
      cols.forEach(c=>{
        const v=perfVal(V,r,c); if(isNaN(v))return; any=true; sum+=v;
        const w=pr!=null?perfVal(V,pr,c):NaN;
        if(!isNaN(w)){ wsum+=v*w; wtot+=w; }
      });
    });
    if(!any)return NaN;
    return RATE_METRICS.has(name) ? (wtot?wsum/wtot:sum/(mods.length*cols.length)) : sum;
  }
  // pick block(s): area includes 'all' -> Total block; single module -> that block; multiple modules -> combine (sum/weighted-avg)
  const areaSel=st.area, isAllArea=areaSel.includes('all');
  const selMods=isAllArea?[]:areaSel.filter(a=>a!=='R');
  const hasR=!isAllArea&&areaSel.includes('R');
  let blk=null, mm={}, g, combineNote='';
  const noDataCard=(lbl)=>'<div class="card" style="border-left:5px solid #d97706"><h3><span class="dot" style="background:#d97706"></span>ไม่มีข้อมูล '+lbl+' ในชีต Performance</h3><div class="hint">ชีต Performance มีเฉพาะ Module A · B · C · D และค่ารวมทั้งฟาร์ม — ข้อมูลกลุ่ม R (New model) ดูได้ที่หน้า Weekly และ Order Harvest</div></div>';
  if(isAllArea){
    blk=blocks.find(b=>/total/i.test(b.label)); if(!blk)blk=blocks[blocks.length-1];
    mm=perfMetricMap(V,blk.row);
    g=(name)=>combineColsOnly(mm,name,cols);
  }else if(selMods.length===0){
    const mb=blocks.find(b=>/new\s*model/i.test(b.label));
    if(!mb){ el('app').innerHTML=noDataCard('Module R'); return; }
    blk=mb; mm=perfMetricMap(V,blk.row);

          prepare:{'1-20':num(V[i][17])||0,'21-30':num(V[i][18])||0,'>30':num(V[i][19])||0}
        };

function aiParseFinancial(fin){
  const V = fin.values||[];
  const fblocks = {};
  for(let i=0;i<V.length;i++){
    if(/ร้อยเพชร/i.test((V[i][0]||'').trim())){
      const lab = ((V[i-2]&&V[i-2][1])||'').trim();
      const mm = (lab.match(/Module\s+([A-Z])/i)||[])[1];
      if(mm){
        const mc = {}; const H = V[i];
        for(let c=0;c<H.length;c++){ const tt=(H[c]||'').trim().toLowerCase(); const mi=MONTHS.indexOf(tt); if(mi>=0) mc[mi]=c; }
        fblocks[mm.toUpperCase()] = {start:i, mc};
      }
    }
  }
  const fr = function(bs,label,from){ for(let i=(from||bs); i<Math.min(bs+54,V.length); i++){ if((V[i][0]||'').trim().toLowerCase()===label.toLowerCase()) return i; } return -1; };
  const byModule = {};
  Object.keys(fblocks).forEach(function(mod){
    const b = fblocks[mod];
    const ml = Object.keys(b.mc).map(Number).sort(function(a,c){return a-c;});
    if(!ml.length) return;
    const rowVal = function(row,mi){ return (row<0||!V[row]) ? 0 : num(V[row][b.mc[mi]]); };
    const rSales=fr(b.start,'Sales'), rNet=fr(b.start,'NetProfit'), rWeight=fr(b.start,'Weight');
    const rSizeAnchor=fr(b.start,'Size');
    const fromRow = rSizeAnchor>=0?rSizeAnchor:b.start;
    const rTotKg=fr(b.start,'Total Cost', fromRow);
    const rNetKg=fr(b.start,'Net Profit', fromRow);
    const rSalesKg=fr(b.start,'Sales', fromRow);
    let li=-1;
    for(let k=ml.length-1;k>=0;k--){ if(rowVal(rWeight,ml[k])>0 || rowVal(rSales,ml[k])>0){ li=k; break; } }
    if(li<0) li=ml.length-1;
    const mi=ml[li];
    byModule[mod] = { month: MONTH_TH[mi]||'', sales: rowVal(rSales,mi), netProfit: rowVal(rNet,mi), weight: rowVal(rWeight,mi), costPerKg: rowVal(rTotKg,mi), netPerKg: rowVal(rNetKg,mi), pricePerKg: rowVal(rSalesKg,mi) };
  });
  const mods = Object.keys(byModule);
  const total = mods.length ? { sales: mods.reduce(function(s,m){return s+(byModule[m].sales||0);},0), netProfit: mods.reduce(function(s,m){return s+(byModule[m].netProfit||0);},0), weight: mods.reduce(function(s,m){return s+(byModule[m].weight||0);},0) } : null;
  return {byModule: byModule, total: total};
}

function aiParsePrepareAgg(prep){
  const V = prep.values;
  if(!V || V.length<23) return {byModule:{}, total:null};
  const mods = ['A','B','C','D','R'];
  const dayRowIdx = {A:3,B:4,C:5,D:6,R:7};
  const byModule = {};
  mods.forEach(function(m){
    const r = V[dayRowIdx[m]]||[];
    byModule[m] = { day1_20:num(r[12])||0, day21_30:num(r[13])||0, dayOver30:num(r[14])||0, total:0, ready:0 };
  });
  const stageCols = {A:16,B:17,C:18,D:19,R:20};
  let totalRow=null, readyRow=null;
  for(let i=12;i<=22 && i<V.length;i++){
    const label = (V[i][11]||'').trim();
    if(label.indexOf('จำนวนเตรียมบ่อ')===0) totalRow=V[i];
    if(label.indexOf('เตรียมบ่อพร้อมปล่อยกุ้ง (บ่อ')===0) readyRow=V[i];
  }
  mods.forEach(function(m){
    if(totalRow) byModule[m].total = num(totalRow[stageCols[m]])||0;
    if(readyRow) byModule[m].ready = num(readyRow[stageCols[m]])||0;
  });
  const total = { day1_20: mods.reduce(function(s,m){return s+byModule[m].day1_20;},0), day21_30: mods.reduce(function(s,m){return s+byModule[m].day21_30;},0), dayOver30: mods.reduce(function(s,m){return s+byModule[m].dayOver30;},0), total: mods.reduce(function(s,m){return s+byModule[m].total;},0), ready: mods.reduce(function(s,m){return s+byModule[m].ready;},0) };
  return {byModule: byModule, total: total};
}

function aiParseBiomassLog(bio){
  const V = bio.values||[];
  const head = V[0]||['Feed_amout','Size_Actual','FR','Biomass (kg.)','Price (BHT/KG)'];
  const rows = V.slice(1).filter(function(r){ return r.some(function(c){return String(c).trim()!=='';}); });
  if(!rows.length) return {last:null,count:0};
  const last = rows[rows.length-1];
  const obj = {};
  head.forEach(function(h,i){ obj[h]=last[i]; });
  return {last: obj, count: rows.length};
}

function aiEsc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function aiModLabel(mod){ return mod==='R' ? 'RW' : mod; }
function aiDetectModule(q){
  if(/\bRW\b/i.test(q)) return 'R';
  let m = q.match(/module\s*([abcd])/i);
  if(m) return m[1].toUpperCase();
  m = q.match(/\b([ABCD])\b/);
  if(m) return m[1].toUpperCase();
  return null;
}
function aiFilterPonds(mod, cultureOnly){
  let arr = AI_DATA.ponds.slice();
  if(cultureOnly!==false) arr = arr.filter(p=>p.status==='Culture');
  if(mod) arr = arr.filter(p=>p.mod===mod);
  return arr;
}
function aiAvgOf(arr, key){
  const vs = arr.map(r=>r[key]).filter(v=>v!==null && v!==undefined && !isNaN(v));
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : NaN;
}
function aiTable(headers, rows){
  return '<table><thead><tr>'+headers.map((h,i)=>`<th${i===0?' class="l"':''}>${h}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>`<td${i===0?' class="l"':''}>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}

  const lowSr = ponds.filter(p=>!isNaN(p.sr) && p.sr<75).sort((a,b)=>a.sr-b.sr).slice(0,5);
  const lowAdg = ponds.filter(p=>!isNaN(p.adg) && p.adg<0.2).sort((a,b)=>a.adg-b.adg).slice(0,5);
  const redWq = AI_DATA.dailyPonds.filter(p=>p.status==='Culture' && (!mod||p.mod===mod) && p.overall==='แดง').slice(0,5);
  if(!highFcr.length && !lowSr.length && !lowAdg.length && !redWq.length) return 'ยังไม่พบบ่อที่มีสัญญาณผิดปกติชัดเจนในขณะนี้ครับ 👍';
  let html = '<b>⚠️ บ่อที่ควรจับตา</b>';

  if(lowAdg.length) html += '<br><br><b>ADG ต่ำ/โตช้า (&lt;0.2)</b>'+aiTable(['บ่อ','Module','ADG'], lowAdg.map(p=>[p.pond, aiModLabel(p.mod), fmt(p.adg,2)]));

function aiAnswerWaterQuality(mod){
  if(!AI_DATA.daily.ready) return 'ยังไม่มีข้อมูลคุณภาพน้ำ (Daily) ในระบบตอนนี้ครับ';
  const upd = AI_DATA.daily.updated ? new Date(AI_DATA.daily.updated).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}) : '';
  let html = (mod? `<b>คุณภาพน้ำวันนี้ Module ${aiModLabel(mod)}</b>` : `<b>คุณภาพน้ำวันนี้ทั้งฟาร์ม</b>`) + (upd?` <span style="color:var(--muted);font-size:12px">(อัปเดต ${upd})</span>`:'');
  const src = mod ? {[mod]:AI_DATA.daily.byModule[mod]} : AI_DATA.daily.byModule;

  const avg = arr => arr.length ? (arr.reduce((x,y)=>x+y,0)/arr.length) : NaN;

    const a = src[m];
    return [aiModLabel(m), isNaN(avg(a.ph))?'-':fmt(avg(a.ph),2), isNaN(avg(a.alk))?'-':fmt(avg(a.alk),0), isNaN(avg(a.tan))?'-':fmt(avg(a.tan),2), isNaN(avg(a.no2))?'-':fmt(avg(a.no2),2), `🟢${fmt(a.green)}/🟡${fmt(a.yellow)}/🔴${fmt(a.red)}`];
  });
  html += aiTable(['Module','pH','Alk','TAN','No-2','เขียว/เหลือง/แดง'], rows);
  return html;
}

function aiAnswerFeed(mod){
  if(!AI_DATA.daily.ready) return 'ยังไม่มีข้อมูลอาหาร (Daily) ในระบบตอนนี้ครับ';
  const src = mod ? {[mod]:AI_DATA.daily.byModule[mod]} : AI_DATA.daily.byModule;
  const mods = Object.keys(src).filter(m=>src[m]);
  if(!mods.length) return 'ยังไม่พบข้อมูลการให้อาหารในพื้นที่นี้ครับ';
  let feedSum=0, stdSum=0;
  const rows = mods.sort().map(m=>{
    const a = src[m]; feedSum+=a.feed; stdSum+=a.stdFeed;
    const diff = a.stdFeed ? ((a.feed-a.stdFeed)/a.stdFeed*100) : NaN;
    return [aiModLabel(m), fmt(a.feed,0), fmt(a.stdFeed,0), isNaN(diff)?'-':(diff>0?'+':'')+fmt(diff,1)+'%'];
  });
  let html = (mod? `<b>อาหารวันนี้ Module ${aiModLabel(mod)}</b>` : `<b>อาหารวันนี้ทั้งฟาร์ม</b>`);
  html += aiTable(['Module','ให้จริง (กก.)','STD (กก.)','ส่วนต่าง'], rows);
  html += `<br>รวมให้จริง <b>${fmt(feedSum,0)}</b> กก. เทียบ STD <b>${fmt(stdSum,0)}</b> กก.`;
  return html;
}

function aiAnswerPond(codeRaw){
  const norm = s => String(s).toUpperCase().replace(/-/g,'');
  const target = norm(codeRaw);
  const p = AI_DATA.ponds.find(x=>norm(x.pond)===target);
  if(!p) return null;
  let html = `<b>บ่อ ${p.pond}</b> (Module ${aiModLabel(p.mod)} · ${p.type||'-'})<br>สถานะ: <b>${p.status||'-'}</b>`;
  if(p.status==='Culture'){
    html += `<br>DOC ${isNaN(p.doc)?'-':fmt(p.doc,0)+' วัน'} · ไซส์ ${isNaN(p.size)?'-':fmt(p.size,0)+' ตัว/กก.'} · MBW ${isNaN(p.mbw)?'-':fmt(p.mbw,2)+' ก.'}`;
    html += `<br>FCR ${isNaN(p.fcr)?'-':fmt(p.fcr,2)} · %SR ${isNaN(p.sr)?'-':fmt(p.sr,0)+'%'} · ADG ${isNaN(p.adg)?'-':fmt(p.adg,2)}`;
    html += `<br>Biomass ${isNaN(p.biomass)?'-':fmt(p.biomass,0)+' กก.'}`;
    if(p.wqColor){
      html += `<br>pH ${isNaN(p.ph)?'-':fmt(p.ph,2)} · Alk ${isNaN(p.alk)?'-':fmt(p.alk,0)} · TAN ${isNaN(p.tan)?'-':fmt(p.tan,2)} · No-2 ${isNaN(p.no2)?'-':fmt(p.no2,2)}`;
      html += `<br>อาหารวันนี้ ${isNaN(p.feed)?'-':fmt(p.feed,0)} กก. เทียบ STD ${isNaN(p.stdFeed)?'-':fmt(p.stdFeed,0)} กก. (${isNaN(p.diffPct)?'-':(p.diffPct>0?'+':'')+fmt(p.diffPct,1)+'%'}) · อัตราตาย ${isNaN(p.mort)?'-':fmt(p.mort,0)+' ตัว/วัน'}`;
      html += `<br>สถานะน้ำรวมวันนี้: <b>${p.wqOverall}</b>`;
    }
  } else if(p.prepStatus){
    html += `<br>เตรียมบ่อมาแล้ว ${isNaN(p.prepDay)?'-':fmt(p.prepDay,0)} วัน · ${p.prepStatus}`;
  }
  return html;
}

function aiAnswer(qRaw){
  const q = (qRaw||'').trim();
  const ql = q.toLowerCase();
  if(!AI_DATA) return 'ระบบกำลังโหลดข้อมูล ลองใหม่อีกครั้งครับ';

  const pondM = q.match(/\b(RW-?[A-Za-z]\d{2,3}|[A-Da-d]\d[A-Za-z]\d{2})\b/);
  if(pondM){ const ans = aiAnswerPond(pondM[1]); if(ans) return ans; }

  const mod = aiDetectModule(q);

  if(/สวัสดี|หวัดดี|^hello|^hi\b|ดีครับ|ดีค่ะ/i.test(q)) return 'สวัสดีครับ 😊 ถามข้อมูลฟาร์มได้เลยครับ เช่น DOC, ไซส์, FCR, แผนจับ, ลงกุ้ง';
  if(/ช่วยอะไร|ทำอะไรได้|^help$|คำสั่ง|ถามอะไรได้/i.test(ql)) return aiHelpMsg();
  if(/ภาพรวม|สรุปฟาร์ม|สรุปทั้งหมด|overview|สถานะฟาร์ม/i.test(q)) return aiAnswerOverview();
  if(/มีปัญหา|บ่อเสี่ยง|ต้องระวัง|ผิดปกติ|จับตา/i.test(q)) return aiAnswerProblems(mod);
  if(/แผนจับ|ผลจับ|จับกุ้ง|harvest|order\s*harvest/i.test(ql)) return aiAnswerHarvest(mod);
  if(/ลงกุ้ง|stocking/i.test(ql)) return aiAnswerStocking(mod);
  if(/เตรียมบ่อ|prepare/i.test(ql)) return aiAnswerPrepare(mod);
  if(/\bfcr\b/i.test(ql)) return aiAnswerMetric('fcr', mod, 'FCR', 2);
  if(/adg|โตช้า|เจริญเติบโต/i.test(ql)) return aiAnswerMetric('adg', mod, 'ADG (g./วัน)', 2);
  if(/%sr|survival|อัตรารอด|\bรอด\b/i.test(ql)) return aiAnswerMetric('sr', mod, '%SR', 0);
  if(/biomass|น้ำหนักรวม|ผลผลิตรวม/i.test(ql)) return aiAnswerBiomass(mod);
  if(/คุณภาพน้ำ|ค่าน้ำ|\bph\b|\balk\b|\btan\b|no-?2|ไนไตรท์|ด่าง/i.test(ql)) return aiAnswerWaterQuality(mod);
  if(/ให้อาหาร|อาหารวันนี้|\bfeed\b|std\s*feed/i.test(ql)) return aiAnswerFeed(mod);
  if(/อัตราตาย|มอทัลลิตี้|mortality|ตายวันนี้|สูญเสีย/i.test(ql)) return aiAnswerMortality(mod);
  if(/\bdoc\b|อายุกุ้ง|วันเลี้ยง|อายุเลี้ยง/i.test(ql)) return aiAnswerDoc(mod);
  if(/ไซส์|ไซซ์|ขนาดกุ้ง|\bsize\b/i.test(ql)) return aiAnswerSize(mod);
  if(/บ่อมีกุ้ง|บ่อว่าง|สิ้นเดือน/i.test(q)) return aiAnswerOccupancy(mod);
  if(/จำนวนบ่อ|บ่อทั้งหมด|ลงทะเบียน|กี่บ่อ/i.test(q)) return aiAnswerPondCount(mod);
  if(/กำไร|ต้นทุน|รายได้|ราคาขาย|revenue|profit|\bcost\b|การเงิน|งบการเงิน|บาท\/กก/i.test(ql)) return aiAnswerFinancial(mod);

  return aiFallback();
}

function aiPush(role, html){ aiState.history.push({role, html}); aiRenderLog(); }
function aiRenderLog(){
  const log = el('aiLog'); if(!log) return;
  log.innerHTML = aiState.history.map(m=>`<div class="aimsg ${m.role==='user'?'user':'bot'}">${m.html}</div>`).join('');
  log.scrollTop = log.scrollHeight;
}
function aiRenderChips(list){
  const c = el('aiChips'); if(!c) return;
  c.innerHTML = list.map(q=>`<span class="aichip" onclick="aiAsk('${q.replace(/'/g,"\\'")}')">${q}</span>`).join('');
}
window.aiAsk = function(q){ const inp=el('aiInput'); if(inp){ inp.value=q; } aiSend(); };
function aiSend(){
  const inp = el('aiInput'); if(!inp) return;
  const q = (inp.value||'').trim(); if(!q) return;
  aiPush('user', aiEsc(q));
  inp.value='';
  setTimeout(()=>{ aiPush('bot', aiAnswer(q)); }, 250);
}

async function renderBiomassTable(){
  const j=await getTab('Estimate Biomass');
  const head=(j&&j.values&&j.values[0])||['Feed_amout','Size_Actual','%FR','Biomass (kg.)','Price (BHT/KG)'];
  const rows=((j&&j.values)||[]).slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  let html='<table class="dtable"><thead><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>';
  if(!rows.length){ html+=`<tr><td colspan="${head.length}">ยังไม่มีข้อมูล</td></tr>`; }
  else{
    rows.slice().reverse().forEach(r=>{ html+='<tr>'+r.map((c,i)=>`<td class="${i===0?'l':''}">${c===''||c==null?'–':c}</td>`).join('')+'</tr>'; });
  }
  html+='</tbody></table>';
  el('bTableWrap').innerHTML=html;
}

async function submitBiomass(){

var PNL_DATA=null, PNL_MODE='multi', PNL_SEL=null, PNL_OV={};

function pnlFRLookup(mbw){
  const t=PNL_DATA.fr; let best=t[1];
  for(let i=1;i<t.length;i++){ const m=num(t[i][0]); if(!isNaN(m)&&m<=mbw) best=t[i]; else if(!isNaN(m)&&m>mbw) break; }
  return num(best[1]);
}
function pnlPriceLookup(size){
  const t=PNL_DATA.price; let best=t[1];
  for(let i=1;i<t.length;i++){ const s=num(t[i][0]); if(!isNaN(s)&&s<=size) best=t[i]; else if(!isNaN(s)&&s>size) break; }
  return num(best[1]);
}
async function pnlLoadData(){
  if(PNL_DATA) return PNL_DATA;
  const [ew,fr,pr]=await Promise.all([getTab('EST Net-profit Week'),getTab('%FR'),getTab('ราคากุ้ง')]);

    const base={

      rai:num(r[3]), docCur:num(r[4]), mbwCur:num(r[5]), biomassCur:num(r[6]),
      srCur:num(r[7]), adgCur:num(r[8]), fcrCur:num(r[9]), wip:num(r[10]),
      feedCumStart:num(r[11]), probiotic:num(r[12]), otherCost:num(r[13]), feedPrice:num(r[14])
    };

      weeksAuto.push({
        doc:num(r[o]), growthAuto:num(r[o+1]), growthAdjust:(r[o+2]===''||r[o+2]==null)?null:num(r[o+2]),
        mbw:num(r[o+3]), srAuto:num(r[o+4]), srAdjust:(r[o+5]===''||r[o+5]==null)?null:num(r[o+5]),
        biomass:num(r[o+6]), fcrAuto:num(r[o+7]), fcrAdjust:(r[o+8]===''||r[o+8]==null)?null:num(r[o+8]),
        feedUsed:num(r[o+9]), feedCost:num(r[o+10]), price:num(r[o+11]), cumCost:num(r[o+12]), profit:num(r[o+13])
      });
    }
    ponds.push(Object.assign({},base,{weeksAuto:weeksAuto}));
  }
  PNL_DATA={ponds:ponds, fr:fr.values, price:pr.values};
  return PNL_DATA;
}
function pnlHasOv(pond){
  const ov=PNL_OV[pond]; if(!ov)return false;
  if(ov.probiotic!=null||ov.otherCost!=null)return true;
  return (ov.weeks||[]).some(function(w){return w&&(w.growth!=null||w.sr!=null||w.fcr!=null);});
}
window.pnlSetOv=function(pond,field,weekIdx,val){
  if(!PNL_OV[pond])PNL_OV[pond]={probiotic:null,otherCost:null,weeks:[{},{},{}]};
  const ov=PNL_OV[pond];

  if(field==='probiotic')ov.probiotic=(isNaN(v)?null:v);
  else if(field==='otherCost')ov.otherCost=(isNaN(v)?null:v);
  else { if(!ov.weeks[weekIdx])ov.weeks[weekIdx]={}; ov.weeks[weekIdx][field]=(isNaN(v)?null:v); }
  pnlRender();
};
window.pnlResetPond=function(pond){ delete PNL_OV[pond]; pnlRender(); };

window.pnlSwitch=function(mode){ PNL_MODE=mode; pnlRender(); };

function pnlSimRaw(p, ov){
  const probiotic=(ov&&ov.probiotic!=null)?ov.probiotic:p.probiotic;
  const otherCost=(ov&&ov.otherCost!=null)?ov.otherCost:p.otherCost;
  let mbwPrev=p.mbwCur, biomassPrev=p.biomassCur, docPrev=p.docCur, feedCum=p.feedCumStart, nonFeedCum=0;
  const weeks=[];
  for(let w=0;w<3;w++){
    const wov=(ov&&ov.weeks&&ov.weeks[w])||{};
    const doc=p.weeksAuto[w].doc;
    const growthAuto=p.adgCur;
    const growth=(wov.growth!=null)?wov.growth:growthAuto;
    const mbw=mbwPrev+growth*(doc-docPrev);
    const srAuto=100*Math.pow(p.srCur/100, doc/p.docCur);
    const sr=(wov.sr!=null)?wov.sr:srAuto;
    const biomass=p.biomassCur*sr*mbw/(p.mbwCur*p.srCur);
    const fcrAuto=p.fcrCur;
    const fcr=(wov.fcr!=null)?wov.fcr:fcrAuto;
    const rate0=pnlFRLookup(mbwPrev)/100, rate1=pnlFRLookup(mbw)/100;
    feedCum+=((rate0+rate1)/2)*((biomassPrev+biomass)/2)*(doc-docPrev);
    const feedCost=feedCum*p.feedPrice;
    nonFeedCum+=(probiotic+otherCost)*p.rai*(doc-docPrev);
    weeks.push({doc:doc,growthAuto:growthAuto,growthAdjust:wov.growth!=null?wov.growth:null,mbw:mbw,
      srAuto:srAuto,srAdjust:wov.sr!=null?wov.sr:null,biomass:biomass,fcrAuto:fcrAuto,fcrAdjust:wov.fcr!=null?wov.fcr:null,
      feedUsed:feedCum,feedCost:feedCost,nonFeedCum:nonFeedCum});
    mbwPrev=mbw; biomassPrev=biomass; docPrev=doc;
  }
  return weeks;
}
function pnlProject(p){
  const ov=PNL_OV[p.pond];
  if(!pnlHasOv(p.pond)) return {weeks:p.weeksAuto, simulated:false};
  const withOv=pnlSimRaw(p, ov);
  const noOv=pnlSimRaw(p, null);
  const weeks=withOv.map(function(w,i){
    const sheetW=p.weeksAuto[i];
    const dMbw=w.mbw-noOv[i].mbw;
    const dBiomass=w.biomass-noOv[i].biomass;
    const dFeedUsed=w.feedUsed-noOv[i].feedUsed;
    const dFeedCost=w.feedCost-noOv[i].feedCost;
    const dNonFeedCost=w.nonFeedCum-noOv[i].nonFeedCum;
    const mbw=sheetW.mbw+dMbw;
    const biomass=sheetW.biomass+dBiomass;
    const feedUsed=sheetW.feedUsed+dFeedUsed;
    const feedCost=sheetW.feedCost+dFeedCost;
    const cumCost=sheetW.cumCost+dFeedCost+dNonFeedCost;
    const size=mbw>0?1000/mbw:0;
    const price=pnlPriceLookup(size);
    const profit=biomass*price-cumCost;
    return {doc:w.doc,growthAuto:w.growthAuto,growthAdjust:w.growthAdjust,mbw:mbw,
      srAuto:w.srAuto,srAdjust:w.srAdjust,biomass:biomass,fcrAuto:w.fcrAuto,fcrAdjust:w.fcrAdjust,
      feedUsed:feedUsed,feedCost:feedCost,price:price,cumCost:cumCost,profit:profit};
  });
  return {weeks:weeks, simulated:true};
}
function pnlComputeAll(){
  return PNL_DATA.ponds.map(function(p){ const r=pnlProject(p); return {p:p, weeks:r.weeks, simulated:r.simulated}; });
}

          +'oninput="document.getElementById(\'pfRngG'+w+'\').value=(this.value!==\'\'?this.value:'+wk.growthAuto+')" '
          +'onchange="pnlSetOv(\''+p.pond+'\',\'growth\','+w+',this.value)"></div>'
        +'<input id="pfRngG'+w+'" type="range" min="0" max="1.5" step="0.0001" value="'+gSlider+'" '
          +'oninput="document.getElementById(\'pfNumG'+w+'\').value=this.value" '
          +'onchange="pnlSetOv(\''+p.pond+'\',\'growth\','+w+',this.value)">'
        +'<div class="pf-hint">Auto: '+fmt(wk.growthAuto,4)+' g./วัน (เว้นว่าง = ใช้ค่า Auto)</div>'
      +'</div>'
      +'<div class="pfield-box">'
        +'<div class="pf-row"><label>%SR Adjust</label>'
        +'<input id="pfNumS'+w+'" type="number" step="0.1" min="0" max="100" placeholder="Auto" value="'+sVal+'" '
          +'oninput="document.getElementById(\'pfRngS'+w+'\').value=(this.value!==\'\'?this.value:'+wk.srAuto+')" '
          +'onchange="pnlSetOv(\''+p.pond+'\',\'sr\','+w+',this.value)"></div>'
        +'<input id="pfRngS'+w+'" type="range" min="0" max="100" step="0.1" value="'+sSlider+'" '
          +'oninput="document.getElementById(\'pfNumS'+w+'\').value=this.value" '
          +'onchange="pnlSetOv(\''+p.pond+'\',\'sr\','+w+',this.value)">'
        +'<div class="pf-hint">Auto: '+fmt(wk.srAuto,2)+'% (เว้นว่าง = ใช้ค่า Auto)</div>'
      +'</div>';
  }

  const ctrl='<div class="card">'
    +'<div class="pnl-sechead amber"><span>ปรับค่า What-if (จำลองเท่านั้น)</span>'+(simulated?'<span class="badge">กำลังจำลอง</span>':'')+'</div>'
    +'<div class="pnl-card-body">'
    +'<div class="hint" style="margin-top:0">เว้นว่างช่องใดให้ใช้ค่าตามสูตร Auto ของชีท (จำลองในหน้านี้เท่านั้น ไม่กระทบข้อมูลจริง) '+(hasOv?'· <button class="pnl-reset" onclick="pnlResetPond(\''+p.pond+'\')">รีเซ็ตบ่อนี้</button>':'· ยังไม่มีการปรับค่า')+'</div>'
    +'<div class="pfield-box"><div class="pf-row"><label>Probiotic (บาท/ไร่/วัน)</label>'
      +'<input type="number" placeholder="Auto '+fmt(p.probiotic,2)+'" value="'+(ov.probiotic!=null?ov.probiotic:'')+'" onchange="pnlSetOv(\''+p.pond+'\',\'probiotic\',0,this.value)"></div></div>'
    +'<div class="pfield-box"><div class="pf-row"><label>ค่าใช้จ่ายอื่น (บาท/ไร่/วัน)</label>'
      +'<input type="number" placeholder="Auto '+fmt(p.otherCost,2)+'" value="'+(ov.otherCost!=null?ov.otherCost:'')+'" onchange="pnlSetOv(\''+p.pond+'\',\'otherCost\',0,this.value)"></div></div>'
    +weekBlocks
    +'</div></div>';

  const sec1='<div class="card">'
    +'<div class="pnl-sechead dark"><span>1) ข้อมูลพื้นฐานบ่อ</span></div>'
    +'<div class="pnl-card-body">'
    +'<div class="pnl-kv"><span class="k">Module / ประเภท</span><span class="v">'+p.module+' · '+p.type+'</span></div>'
    +'<div class="pnl-kv"><span class="k">พื้นที่บ่อ (ไร่)</span><span class="v">'+fmt(p.rai,2)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">DOC ปัจจุบัน (วัน)</span><span class="v">'+fmt(p.docCur)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">MBW ปัจจุบัน (g.)</span><span class="v">'+fmt(p.mbwCur,2)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">Biomass ปัจจุบัน (กก.)</span><span class="v">'+fmt(p.biomassCur)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">%SR ปัจจุบัน</span><span class="v">'+fmt(p.srCur,2)+'%</span></div>'
    +'<div class="pnl-kv"><span class="k">ADG ปัจจุบัน (g./วัน)</span><span class="v">'+fmt(p.adgCur,4)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">WIP (บาท)</span><span class="v">'+fmt(p.wip)+'</span></div>'
    +'</div></div>';

  const periods=[{lab:'ปัจจุบัน',doc:p.docCur,mbw:p.mbwCur,sr:p.srCur,biomass:p.biomassCur,costKg:null,profitKg:null,profit:null}];
  for(let w=0; w<3; w++){
    const wk=weeks[w];
    const costKg=wk.biomass>0?wk.cumCost/wk.biomass:0;
    const profitKg=wk.biomass>0?wk.profit/wk.biomass:0;
    periods.push({lab:'สัปดาห์ '+(w+1),doc:wk.doc,mbw:wk.mbw,sr:(wk.srAdjust!=null?wk.srAdjust:wk.srAuto),biomass:wk.biomass,costKg:costKg,profitKg:profitKg,profit:wk.profit});
  }
  function rowCells(getter,dec,colorize){
    return periods.map(function(x){
      const v=getter(x);
      if(v==null) return '<td>-</td>';
      if(colorize) return '<td class="'+(v>=0?'profit-pos':'profit-neg')+'">'+fmt(v,dec)+'</td>';
      return '<td>'+fmt(v,dec)+'</td>';
    }).join('');
  }
  const theadPeriods='<th>รายการ</th>'+periods.map(function(x){return '<th>'+x.lab+'</th>';}).join('');
  const tableRows=
    '<tr><td>DOC (วัน)</td>'+rowCells(function(x){return x.doc;},0)+'</tr>'
    +'<tr><td>MBW (g.)</td>'+rowCells(function(x){return x.mbw;},2)+'</tr>'
    +'<tr><td>%SR</td>'+rowCells(function(x){return x.sr;},2)+'</tr>'
    +'<tr><td>Biomass (กก.)</td>'+rowCells(function(x){return x.biomass;},0)+'</tr>'
    +'<tr><td>ต้นทุน/กก. (บาท)</td>'+rowCells(function(x){return x.costKg;},2)+'</tr>'
    +'<tr><td>กำไร/ขาดทุน/กก. (บาท)</td>'+rowCells(function(x){return x.profitKg;},2,true)+'</tr>'
    +'<tr><td>กำไร/ขาดทุน (บาท)</td>'+rowCells(function(x){return x.profit;},0,true)+'</tr>';
  const sec2='<div class="card">'
    +'<div class="pnl-sechead emerald"><span>2) ผลผลิตและกำไร/ขาดทุนคาดการณ์รายสัปดาห์</span></div>'
    +'<div class="pnl-card-body">'
    +'<div class="maptbl-wrap"><table class="dtable stripe"><thead><tr>'+theadPeriods+'</tr></thead><tbody>'+tableRows+'</tbody></table></div>'
    +'</div><div style="padding:0 16px 16px"><canvas id="pnlSingleGrowth" height="220"></canvas></div></div>';

  const wk3=weeks[2];
  const feedCost3=wk3.feedCost;
  const nonFeedCost3=wk3.cumCost-p.wip-feedCost3;
  const sec4='<div class="card">'
    +'<div class="pnl-sechead dark"><span>3) ต้นทุนสะสม ณ สิ้นสัปดาห์ 3</span></div>'
    +'<div class="pnl-card-body">'
    +'<div class="pnl-kv"><span class="k">WIP (ยกมา)</span><span class="v">'+fmt(p.wip)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">ต้นทุนอาหาร</span><span class="v">'+fmt(feedCost3)+'</span></div>'
    +'<div class="pnl-kv"><span class="k">ต้นทุนอื่น (Probiotic+ค่าใช้จ่ายอื่น)</span><span class="v">'+fmt(nonFeedCost3)+'</span></div>'
    +'<div class="pnl-kv" style="border-top:2px solid var(--line);margin-top:4px;padding-top:10px"><span class="k" style="font-weight:700">ต้นทุนรวมทั้งหมด</span><span class="v" style="color:var(--red)">'+fmt(wk3.cumCost)+'</span></div>'
    +'<div class="pnl-kv"><span class="k" style="font-weight:700">ต้นทุนต่อกก.</span><span class="v">'+fmt(wk3.biomass>0?wk3.cumCost/wk3.biomass:0,2)+' บาท/กก.</span></div>'
    +'</div><div style="padding:0 16px 16px"><canvas id="pnlSingleCost" height="220"></canvas></div></div>';

  const revenue3=wk3.biomass*wk3.price;
  const profitPerKg3=wk3.biomass>0?wk3.profit/wk3.biomass:0;
  const profitPerRai3=p.rai>0?wk3.profit/p.rai:0;
  const sec5='<div class="card">'
    +'<div class="pnl-sechead emerald"><span>4) รายได้ และกำไร/ขาดทุนคาดการณ์ (สัปดาห์ 3)</span></div>'
    +'<div class="pnl-card-body">'
    +'<div class="pnl-banner '+(wk3.profit>=0?'pos':'neg')+'">'
      +'<div class="plabel">ราคากุ้ง ณ Size คาดการณ์ '+fmt(wk3.price,0)+' บาท/กก. · รายได้คาดการณ์ '+fmt(revenue3)+' บาท</div>'
      +'<div class="amt" style="color:'+(wk3.profit>=0?'var(--green)':'var(--red)')+'">'+fmt(wk3.profit)+' บาท</div>'
      +'<div class="plabel">กำไร/ขาดทุนคาดการณ์</div>'
    +'</div>'
    +'<div class="pnl-ctrl" style="margin-top:12px">'
      +'<div class="pnl-box"><div class="plabel">กำไร/ขาดทุนต่อกก.</div><div class="pval" style="color:'+(profitPerKg3>=0?'var(--green)':'var(--red)')+'">'+fmt(profitPerKg3,2)+' บาท/กก.</div></div>'
      +'<div class="pnl-box"><div class="plabel">กำไร/ขาดทุนต่อไร่</div><div class="pval" style="color:'+(profitPerRai3>=0?'var(--green)':'var(--red)')+'">'+fmt(profitPerRai3,0)+' บาท/ไร่</div></div>'
    +'</div></div></div>';

  el('pnlBody').innerHTML=selectorHtml+'<div class="pnl-layout"><div class="pnl-col-left">'+ctrl+sec1+'</div><div class="pnl-col-right">'+sec2+sec4+sec5+'</div></div>';
  pnlDrawSingleCharts(p,weeks);
}

function pnlDrawSingleCharts(p, weeks){
  const labs=['ปัจจุบัน','สัปดาห์ 1','สัปดาห์ 2','สัปดาห์ 3'];
  const mbwArr=[p.mbwCur].concat(weeks.map(function(w){return w.mbw;}));
  const bioArr=[p.biomassCur].concat(weeks.map(function(w){return w.biomass;}));
  const cG=el('pnlSingleGrowth');
  if(cG){ charts.push(new Chart(cG,{data:{labels:labs,datasets:[
    {type:'line',label:'MBW (g.)',data:mbwArr,borderColor:'#0ea5e9',backgroundColor:'#0ea5e9',yAxisID:'y',tension:0.3},
    {type:'line',label:'Biomass (กก.)',data:bioArr,borderColor:'#16a34a',backgroundColor:'#16a34a',yAxisID:'y1',tension:0.3}
  ]},options:{plugins:{legend:{position:'bottom'}},scales:{y:{type:'linear',position:'left',title:{display:true,text:'g.'}},y1:{type:'linear',position:'right',title:{display:true,text:'กก.'},grid:{drawOnChartArea:false}}}}}));
  }
  const wk3=weeks[2];
  const feedCost3=wk3.feedCost;
  const nonFeedCost3=wk3.cumCost-p.wip-feedCost3;
  const cC=el('pnlSingleCost');
  if(cC){ charts.push(new Chart(cC,{type:'doughnut',data:{labels:['WIP (ยกมา)','ต้นทุนอาหาร','ต้นทุนอื่น'],datasets:[{data:[p.wip,feedCost3,nonFeedCost3],backgroundColor:['#94a3b8','#f59e0b','#8b5cf6']}]},
    options:{plugins:{legend:{position:'bottom'}}}}));
  }
}


/* ---------- INIT ---------- */
route();
</script>
</body>
</html>
